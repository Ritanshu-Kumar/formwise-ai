services:
  postgres:
    image: postgres:17
    container_name: formwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: formwise
      POSTGRES_USER: formwise
      POSTGRES_PASSWORD: formwise_dev_password
    ports:
      - "5432:5432"
    volumes:
      - formwise_postgres_data:/var/lib/postgresql/data

volumes:
  formwise_postgres_data: